name: Strava Auto Post

on:
  schedule:
    # 分 時 日 月 星期
    # 31 15 代表 UTC 15:31，等於 HKT 星期日晚上 23:31
    # 0 代表星期日
    - cron: '31 15 * * 0'
  workflow_dispatch: # 保留手動執行的按鈕

jobs:
  run-script:
    runs-on: ubuntu-latest # 使用 GitHub 免費提供的 Linux 機器
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run script
        env:
          # 把 GitHub Secret 裡的 Cookie 傳遞給 Node.js 腳本
          STRAVA_COOKIES: ${{ secrets.STRAVA_COOKIES }}
        run: node index.js
# 在 Run script 之後加上這段
      - name: Upload screenshot if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
