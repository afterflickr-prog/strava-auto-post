name: Strava Auto Post

on:
  schedule:
    # 分 時 日 月 星期
    # 31 15 代表 UTC 15:31，等於 HKT 星期日晚上 23:31
    # 0 代表星期日
    - cron: '31 15 * * 0'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # 🌟 必須加呢段：賦予工作流寫入權限，等佢可以自動 Push Commit 續期
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run script
        env:
          STRAVA_COOKIES: ${{ secrets.STRAVA_COOKIES }}
        run: node index.js

      # 🌟 加喺呢度：每次定時行完，不論成功與否都自動推一個空白 Commit 嚟餵飽 GitHub 60日機制
      - name: Keep workflow alive
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit --allow-empty -m "Routine keep-alive commit"
          git push

      - name: Upload screenshot if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            *.jpg
